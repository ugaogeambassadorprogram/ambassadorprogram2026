<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OGE Ambassador Program</title>
  <style>
    :root {
      --uga-red: #BA0C2F;
      --uga-black: #000000;
      --uga-yellow: #FFE500;
      --uga-white: #FFFFFF;
      --btn-bg: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: #1A1A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    /* DESKTOP FRAME (FIGMA MACBOOK VIEW) */
    .figma-desktop-frame {
      width: 100%;
      max-width: 960px;
      background-color: var(--uga-red);
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    @media (min-width: 768px) {
      .figma-desktop-frame {
        grid-template-columns: 1.4fr 1fr;
        min-height: 520px;
      }
    }

    /* LEFT CONTAINER: GREETING & UPLOAD */
    .left-panel {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--uga-white);
    }

    .brand-banner {
      background-color: var(--uga-black);
      padding: 0.6rem 1rem;
      text-align: center;
      margin: -2.5rem -2.5rem 2rem -2.5rem;
    }

    .brand-banner .sub {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      color: #DDD;
      text-transform: uppercase;
    }

    .brand-banner h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      font-family: Georgia, serif;
    }

    .greeting {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 2rem;
    }

    /* DROPZONE CARD */
    .upload-box {
      background-color: var(--btn-bg);
      border-radius: 20px;
      padding: 1.5rem;
      text-align: center;
      color: #333;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .upload-box:hover {
      background-color: #FFFFFF;
      transform: translateY(-2px);
    }

    .upload-icon {
      width: 36px;
      height: 36px;
      border: 2px dashed #666;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #666;
    }

    .pill-nav {
      background-color: var(--btn-bg);
      border-radius: 25px;
      padding: 0.85rem;
      text-align: center;
      color: #555;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 0.75rem;
      cursor: pointer;
    }

    /* RIGHT CONTAINER: BLACK POINTS CARD */
    .right-panel {
      background-color: var(--uga-black);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      color: var(--uga-white);
    }

    .right-panel h2 {
      font-size: 1.3rem;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      font-weight: 700;
    }

    .points-display-grid {
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex: 1;
    }

    /* CIRCULAR POINTS BADGE */
    .circle-badge {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-color: #222;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 800;
    }

    /* VERTICAL THERMOMETER GAUGE */
    .gauge-wrapper {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .gauge-bar {
      width: 45px;
      height: 200px;
      background-color: #222;
      border-radius: 4px;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
      border: 1px solid #333;
    }

    .gauge-fill {
      background-color: var(--uga-yellow);
      width: 100%;
      height: 60%; /* Dynamic percent fill */
      transition: height 0.5s ease-in-out;
    }

    .gauge-ticks {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 200px;
      font-size: 0.7rem;
      color: #AAA;
      font-weight: 600;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="figma-desktop-frame">
    
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div>
        <div class="brand-banner">
          <div class="sub">Office of Global Engagement</div>
          <h1>AMBASSADOR PROGRAM</h1>
        </div>

        <!-- LOGIN OR GREETING -->
        <div id="login-view">
          <h2 class="greeting">Enter Name</h2>
          <input type="text" id="name-input" placeholder="e.g. Charlotte Holzapfel" style="width: 100%; padding: 0.8rem; border-radius: 12px; border: none; margin-bottom: 1rem; font-size: 1rem;"/>
          <select id="prog-input" style="width: 100%; padding: 0.8rem; border-radius: 12px; border: none; margin-bottom: 1rem; font-size: 1rem;">
            <option value="Week">Week (60 Pts)</option>
            <option value="Maymester">Maymester (100 Pts)</option>
            <option value="Semester">Semester (150 Pts)</option>
          </select>
          <div class="pill-nav" id="login-btn" style="background: #000; color: #FFF;">Enter Portal</div>
        </div>

        <div id="dash-view" class="hidden">
          <h2 class="greeting">Hi, <span id="user-first-name">Charlotte</span>.<br/>Welcome back!</h2>
          
          <div class="upload-box" id="upload-trigger">
            <div class="upload-icon">+</div>
            <span style="font-weight: 700; font-size: 0.9rem;">Upload your content</span>
          </div>

          <div class="pill-nav">List of Activities</div>
          <div class="pill-nav">My Submissions</div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL (BLACK CARD) -->
    <div class="right-panel">
      <h2>POINTS:</h2>
      <div class="points-display-grid">
        <div class="circle-badge" id="pts-val">90</div>

        <div class="gauge-wrapper">
          <div class="gauge-ticks">
            <span>75%</span>
            <span>50%</span>
            <span>25%</span>
          </div>
          <div class="gauge-bar">
            <div class="gauge-fill" id="gauge-fill-bar"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "YOUR_EXACT_DEPLOYED_APPS_SCRIPT_URL_HERE";

    const loginView = document.getElementById('login-view');
    const dashView = document.getElementById('dash-view');
    const loginBtn = document.getElementById('login-btn');

    loginBtn.addEventListener('click', () => {
      const name = document.getElementById('name-input').value.trim();
      const prog = document.getElementById('prog-input').value;
      if (name) {
        localStorage.setItem('oge_name', name);
        localStorage.setItem('oge_prog', prog);
        initDash(name, prog);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('oge_name');
      const savedProg = localStorage.getItem('oge_prog');
      if (savedName) initDash(savedName, savedProg);
    });

    async function initDash(fullName, prog) {
      loginView.classList.add('hidden');
      dashView.classList.remove('hidden');

      const firstName = fullName.split(' ')[0];
      document.getElementById('user-first-name').textContent = firstName;

      try {
        const res = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(fullName)}&program=${encodeURIComponent(prog)}`);
        const data = await res.json();
        if (data.status === 'success') {
          document.getElementById('pts-val').textContent = data.pointsAchieved;
          const pct = Math.min(100, Math.round((data.pointsAchieved / data.pointsNeeded) * 100));
          document.getElementById('gauge-fill-bar').style.height = `${pct}%`;
        }
      } catch(e) { console.error(e); }
    }
  </script>
</body>
</html>
