<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OGE Ambassador Program | UGA</title>
  <style>
    :root {
      --uga-red: #BA0C2F;
      --uga-dark-red: #8B0000;
      --uga-black: #000000;
      --text-light: #FFFFFF;
      --text-dark: #111111;
      --card-glass: rgba(0, 0, 0, 0.25);
      --focus-ring: #FFD700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--uga-red) 0%, var(--uga-dark-red) 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    /* CONTAINER RESPONSIOVISM */
    .app-viewport {
      width: 100%;
      max-width: 1020px; /* Expands smoothly on Desktop */
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* HEADER */
    .brand-header {
      background-color: var(--uga-black);
      padding: 1.25rem 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border-bottom: 3px solid var(--uga-red);
    }

    .brand-header .sub-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #BBB;
    }

    .brand-header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-top: 0.2rem;
    }

    /* CARDS & GLASSMORPHISM */
    .figma-card {
      background: var(--card-glass);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .dark-card {
      background-color: var(--uga-black);
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .greeting-title {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    /* GRID LAYOUT FOR DESKTOP */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr; /* Stacked by default for mobile */
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr 280px; /* Side-by-side Desktop layout */
      }
    }

    /* FORMS & INPUTS */
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input, select {
      width: 100%;
      padding: 0.9rem 1.1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.95);
      color: var(--text-dark);
      font-size: 1rem;
      margin-bottom: 1.25rem;
    }

    input:focus, select:focus, button:focus {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* PILL BUTTONS */
    .pill-btn {
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: 30px;
      border: none;
      background-color: var(--uga-black);
      color: var(--text-light);
      font-weight: 800;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      background-color: #222222;
      transform: translateY(-2px);
    }

    .pill-btn.light {
      background-color: rgba(255, 255, 255, 0.95);
      color: var(--text-dark);
    }

    /* CIRCLE GAUGE & STACKED BAR */
    .gauge-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .circle-gauge {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .circle-gauge .val {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
    }

    .circle-gauge .lbl {
      font-size: 0.65rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-top: 2px;
    }

    .stacked-bar-container {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      height: 160px;
      width: 100%;
      max-width: 120px;
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden;
      position: relative;
    }

    .stacked-bar-fill {
      background-color: #FFF500; /* Figma yellow fill */
      width: 100%;
      height: 0%;
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bar-markers {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.3rem 0.5rem;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.75);
      pointer-events: none;
      font-weight: bold;
    }

    .hidden { display: none !important; }

    .status-msg {
      padding: 0.85rem;
      border-radius: 10px;
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
      font-weight: bold;
    }
    .status-msg.error { background-color: #721C24; color: #FFF; }
    .status-msg.success { background-color: #155724; color: #FFF; }

    .sub-list { list-style: none; }
    .sub-list li {
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- HEADER -->
    <header class="brand-header" role="banner">
      <div class="sub-title">Office of Global Engagement</div>
      <h1>AMBASSADOR PROGRAM</h1>
    </header>

    <main id="main-content">

      <!-- STEP 1: INITIAL LOGIN / IDENTIFICATION -->
      <section id="login-section">
        <div class="figma-card" style="max-width: 500px; margin: 0 auto;">
          <h2 class="greeting-title" style="margin-bottom: 1rem;">Welcome</h2>
          <p style="margin-bottom: 1.5rem; opacity: 0.9;">Please enter your details to access your point tracking dashboard.</p>
          
          <form id="login-form">
            <label for="student-name">Full Name:</label>
            <input type="text" id="student-name" required placeholder="e.g. Charlotte Holzapfel" />

            <label for="program-length">Program Length:</label>
            <select id="program-length" required>
              <option value="">-- Select Program --</option>
              <option value="Week">Week (60 Points Required)</option>
              <option value="Maymester">Maymester (100 Points Required)</option>
              <option value="Semester">Semester (150 Points Required)</option>
            </select>

            <button type="submit" class="pill-btn">Access Dashboard</button>
          </form>
        </div>
      </section>

      <!-- STEP 2: DASHBOARD (FIGMA DESKTOP / MOBILE COMPATIBLE) -->
      <section id="dashboard-section" class="hidden">
        
        <div class="dashboard-grid">
          <!-- LEFT: PERSONALIZED GREETING & UPLOAD CTA -->
          <div class="figma-card" style="display: flex; flex-direction: column; justify-content: space-between;">
            <div>
              <h2 class="greeting-title">Hi, <span id="display-first-name">Ambassador</span>.<br/>Welcome back!</h2>
              <p style="margin-top: 0.5rem; font-size: 1rem; opacity: 0.9;">
                Tracked Program: <strong id="display-program-type">--</strong>
              </p>
            </div>
            <button id="open-upload-btn" class="pill-btn light" style="margin-top: 2rem;">Upload Your Content</button>
          </div>

          <!-- RIGHT: POINTS GAUGE CARD -->
          <div class="figma-card dark-card">
            <div class="gauge-container">
              <div class="circle-gauge">
                <span class="lbl">POINTS</span>
                <span class="val" id="pts-achieved">0</span>
              </div>

              <div class="stacked-bar-container" role="progressbar" id="progress-bar-element" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="stacked-bar-fill" id="progress-fill"></div>
                <div class="bar-markers">
                  <span>75%</span>
                  <span>50%</span>
                  <span>25%</span>
                </div>
              </div>
              <p style="margin-top: 0.75rem; font-size: 0.8rem; opacity: 0.8;">Goal: <span id="pts-needed">0</span> pts</p>
            </div>
          </div>
        </div>

        <!-- UPLOAD CONTENT CARD -->
        <div id="upload-card" class="figma-card hidden" style="margin-top: 1.5rem;">
          <h3 style="margin-bottom: 1.25rem;">Submit Content</h3>
          <form id="submission-form">
            <label for="user-email">UGA Email Address:</label>
            <input type="email" id="user-email" required placeholder="username@uga.edu" />

            <label for="activity-select">Activity Performed:</label>
            <select id="activity-select" required>
              <option value="">-- Select Activity --</option>
              <option value="Social Media Post">Social Media Post (10 pts)</option>
              <option value="Tabling Event">Tabling Event (20 pts)</option>
              <option value="Presentation">Presentation (30 pts)</option>
              <option value="Blog/Article">Blog/Article (15 pts)</option>
            </select>

            <label for="file-upload">Upload Proof / Submission File:</label>
            <input type="file" id="file-upload" accept="image/*,application/pdf" />

            <button type="submit" id="submit-btn" class="pill-btn">Submit Activity</button>
          </form>
          <div id="form-feedback" class="status-msg hidden" aria-live="polite"></div>
        </div>

        <!-- SUBMISSION HISTORY -->
        <div class="figma-card" style="margin-top: 1.5rem;">
          <h3 style="margin-bottom: 1rem;">My Submissions</h3>
          <ul id="history-list" class="sub-list">
            <li><span>No submissions logged yet.</span></li>
          </ul>
          <button id="logout-btn" class="pill-btn" style="margin-top: 1.5rem; background-color: rgba(0,0,0,0.5); width: auto; min-width: 200px;">Switch User</button>
        </div>

      </section>

    </main>
  </div>

  <script>
    // PASTE YOUR EXACT DEPLOYED APPS SCRIPT WEB APP URL HERE
    const SCRIPT_URL = "YOUR_EXACT_DEPLOYED_APPS_SCRIPT_URL_HERE";

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const submissionForm = document.getElementById('submission-form');
    const uploadCard = document.getElementById('upload-card');
    const openUploadBtn = document.getElementById('open-upload-btn');
    const feedback = document.getElementById('form-feedback');

    document.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('oge_ambassador_name');
      const savedProgram = localStorage.getItem('oge_ambassador_program');
      if (savedName && savedProgram) {
        loadDashboard(savedName, savedProgram);
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const fullName = document.getElementById('student-name').value.trim();
      const program = document.getElementById('program-length').value;
      if (fullName && program) {
        localStorage.setItem('oge_ambassador_name', fullName);
        localStorage.setItem('oge_ambassador_program', program);
        loadDashboard(fullName, program);
      }
    });

    openUploadBtn.addEventListener('click', () => {
      uploadCard.classList.toggle('hidden');
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('oge_ambassador_name');
      localStorage.removeItem('oge_ambassador_program');
      dashboardSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
    });

    async function loadDashboard(fullName, program) {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');

      // Extract only first name for greeting
      const firstName = fullName.split(' ')[0];
      document.getElementById('display-first-name').textContent = firstName;
      document.getElementById('display-program-type').textContent = program;

      try {
        const res = await fetch(`${SCRIPT_URL}?name=${encodeURIComponent(fullName)}&program=${encodeURIComponent(program)}`);
        const data = await res.json();

        if (data.status === 'success') {
          document.getElementById('pts-achieved').textContent = data.pointsAchieved;
          document.getElementById('pts-needed').textContent = data.pointsNeeded;

          // Animate Progress Gauge
          const pct = Math.min(100, Math.round((data.pointsAchieved / data.pointsNeeded) * 100));
          const fill = document.getElementById('progress-fill');
          fill.style.height = `${pct}%`;
          
          const bar = document.getElementById('progress-bar-element');
          bar.setAttribute('aria-valuenow', pct);

          // Populate History
          const historyList = document.getElementById('history-list');
          historyList.innerHTML = '';
          if (data.history.length === 0) {
            historyList.innerHTML = '<li><span>No submissions found.</span></li>';
          } else {
            data.history.forEach(item => {
              const li = document.createElement('li');
              li.innerHTML = `<span>${item.activity}</span><strong>+${item.points} pts</strong>`;
              historyList.appendChild(li);
            });
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    submissionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading...';
      feedback.classList.add('hidden');

      const fullName = localStorage.getItem('oge_ambassador_name');
      const program = localStorage.getItem('oge_ambassador_program');
      const email = document.getElementById('user-email').value;
      const activity = document.getElementById('activity-select').value;
      const fileInput = document.getElementById('file-upload');

      let fileData = null, fileName = null, fileMime = null;
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileMime = file.type;
        fileData = await convertBase64(file);
      }

      const payload = { name: fullName, email, activity, fileData, fileName, fileMime };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        feedback.textContent = 'Content uploaded successfully!';
        feedback.className = 'status-msg success';
        feedback.classList.remove('hidden');
        submissionForm.reset();
        
        loadDashboard(fullName, program);
      } catch (err) {
        feedback.textContent = 'Upload failed. Please try again.';
        feedback.className = 'status-msg error';
        feedback.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Activity';
      }
    });

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
